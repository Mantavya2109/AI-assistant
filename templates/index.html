<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title>AI Sahayak</title>
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <h1>Hello from AI Sahayak</h1>
        <div class="main-heading">
            <h2>Ask me anything</h2>
            <form id="askForm">
                <input type="text" name="question" placeholder="Ask your Query" required>
                <button type="submit">ASK</button>
            </form>
            <p id="ask-loading" style="display: none;">Loading...</p>
            <div id="answer" class="response-container"></div>

            <h2>Summarize Email</h2>
            <form id="emailForm">
                <textarea type="text" name="email" placeholder="Place your Email" required></textarea>
                <button type="submit">Summarize</button>
            </form>
            <p id="summary-loading" style="display: none;">Loading...</p>
            <div id="summary" class="response-container"></div>
        </div>

        <footer class="app-footer">
            <p>© 2026 AI Sahayak · Created by <strong>Mantavya Patel</strong></p>
        </footer>
    </div>
</body>
<script>
    document.getElementById("askForm").onsubmit = async (e) => {
        e.preventDefault();
        let formData = new FormData(e.target);
        let loading = document.getElementById("ask-loading");
        let answerEl = document.getElementById("answer");
        
        loading.style.display = "block"; // show loader
        answerEl.innerHTML = "";

        try {
            let res = await fetch("/ask", {
                method: "POST",
                body: formData
            });

            let data = await res.json();
            let rawText = data.response || "No response received.";
            answerEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(rawText) : rawText;
        } catch (err) {
            answerEl.innerHTML = "<p>Error communicating with server.</p>";
        } finally {
            loading.style.display = "none";
        }
    };

    document.getElementById("emailForm").onsubmit = async (e) => {
        e.preventDefault();
        let formData = new FormData(e.target);
        let loading = document.getElementById("summary-loading");
        let summaryEl = document.getElementById("summary");

        loading.style.display = "block"; // show loader
        summaryEl.innerHTML = "";

        try {
            let res = await fetch("/summarize", {
                method: "POST",
                body: formData
            });

            let data = await res.json();
            let rawText = data.response || "No response received.";
            summaryEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(rawText) : rawText;
        } catch (err) {
            summaryEl.innerHTML = "<p>Error communicating with server.</p>";
        } finally {
            loading.style.display = "none";
        }
    };
</script>

</html>
